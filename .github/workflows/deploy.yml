name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Re-apply infra/main.bicep before deploying'
        type: boolean
        default: false

# One deploy at a time; never cancel a running deploy (a half-uploaded package is worse than a queue).
concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

# The build needs nothing but the code; only the deploy job is handed a token it can log in to Azure with.
permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_WEBAPP_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build (Release, warnings are errors)
        run: dotnet build PoFightJudge.slnx -c Release
      - name: Formatting
        run: dotnet format PoFightJudge.slnx --verify-no-changes --no-restore
      # Unit and E2EAPI gate the pipeline: both run in-process on the fakes. Integration needs Azurite and E2EUI needs
      # Playwright and a microphone fixture; those two run locally via SCRIPTS/setup.ps1.
      - name: Unit tests
        run: dotnet test tests/PoFightJudge.Unit --no-build -c Release --verbosity minimal
      - name: API tests
        run: dotnet test tests/PoFightJudge.E2EAPI --no-build -c Release --verbosity minimal
      - name: Publish API
        run: dotnet publish src/PoFightJudge.Api -c Release --no-build -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 3

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # OIDC federated credential for azure/login — no stored secret
    environment:
      name: production
      url: ${{ env.AZURE_WEBAPP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      # Federated credential subjects: repo:punkouter26/PoFightJudge:ref:refs/heads/master and :environment:production
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same step in every Po web repo. F1 gives the app about 60 CPU-minutes a day; once spent, Azure stops the
      # site (usageState Exceeded) until 00:00 UTC and refuses the package with a bare 403. Say what it is.
      - name: Check the F1 daily CPU quota
        run: |
          usage=$(az webapp show -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --query usageState -o tsv)
          if [ "$usage" = "Exceeded" ]; then
            echo "::error::${{ vars.AZURE_WEBAPP_NAME }} has used up its F1 daily CPU quota, so Azure refuses the package until 00:00 UTC. Rerun after that."
            exit 1
          fi

      # `github.event.before` exists only on push, so the git compare has to be skipped on a manual run — otherwise it
      # errors, falls through to the else, and re-applies Bicep on every dispatch however the checkbox was left.
      - name: Did infra change?
        id: infra
        run: |
          if [ "${{ inputs.deploy_infra }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- infra/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # An unknown base (first push on a branch, force push): re-apply. Bicep is idempotent.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision infra (Bicep)
        if: steps.infra.outputs.changed == 'true'
        run: az deployment sub create --location eastus2 --template-file infra/main.bicep --name pofightjudge-${{ github.run_id }} -o none

      # Same pair in every Po web repo: keep the live build, and put it back if anything fails once the
      # new package is live (see "Roll back to the previous build" at the end of this job).
      - name: Back up the live site
        id: backup
        run: |
          token=$(az account get-access-token --query accessToken -o tsv)
          if curl -fsS --max-time 300 -H "Authorization: Bearer $token" -o previous.zip \
               "https://${{ vars.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zip/site/wwwroot/" && [ -s previous.zip ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Backed up $(du -h previous.zip | cut -f1) of the live site."
          else
            echo "::warning title=No backup::Could not download the live site, so this deploy cannot be rolled back."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish

      # The deploy returns when the package is accepted, not when the site serves it.
      # Same gate in every Po web repo: the new build is the one answering (X-Commit on /health/live is this
      # commit, not the old instance still serving), then its dependencies answer (/health).
      - name: Health gate (this commit on /health/live, then /health)
        shell: bash
        run: |
          base="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for attempt in $(seq 1 60); do
            commit=$(curl -s -D - -o /dev/null --max-time 30 "$base/health/live" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit" {print $2}')
            [ "$commit" = "$GITHUB_SHA" ] && { echo "/health/live serves $GITHUB_SHA (attempt $attempt)"; break; }
            [ "$attempt" = "60" ] && { echo "::error::/health/live still serves ${commit:-no X-Commit header}, not $GITHUB_SHA"; exit 1; }
            sleep 15
          done
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/health" || echo 000)
            [ "$code" = "200" ] && { echo "/health -> 200 (attempt $attempt)"; exit 0; }
            sleep 15
          done
          echo "::error::/health never returned 200 (last: $code)"; exit 1

      - name: Smoke test the deployed site
        run: |
          set -euo pipefail
          url="${{ env.AZURE_WEBAPP_URL }}"
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$1" || echo 000; }
          for attempt in $(seq 1 30); do
            [ "$(code /api/health)" = "200" ] && { echo "health OK after ${attempt} attempt(s)"; break; }
            [ "$attempt" = "30" ] && { echo "::error::/api/health never returned 200"; exit 1; }
            sleep 10
          done
          # A cold F1 instance answers /api/health before the rest of the app is warm, so each assertion gets a
          # few attempts of its own instead of one shot the moment health first goes green.
          expect() {
            for attempt in $(seq 1 6); do
              got=$(code "$1")
              [ "$got" = "$2" ] && return 0
              sleep 5
            done
            echo "::error::$1 returned $got, expected $2"
            exit 1
          }
          expect /login 200                    # WASM shell served
          expect /_framework/dotnet.js 200     # WASM runtime present (no blazor.boot.json in .NET 10)
          expect /manifest.webmanifest 200     # installable
          expect /api/matches 401              # the API is protected
          expect /api/no-such-route 404        # no catch-all swallowing API routes
          echo "Smoke test passed."

      - name: Roll back to the previous build
        if: failure() && steps.deploy.outcome == 'success' && steps.backup.outputs.ok == 'true'
        run: |
          az webapp deploy -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path previous.zip --type zip --clean true
          echo "::error title=Rolled back::${{ github.sha }} failed after it went live; the previous build is live again."
