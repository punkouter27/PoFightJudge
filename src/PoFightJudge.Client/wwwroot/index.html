<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>PoFightJudge</title>
  <base href="/" />
  <!-- Radzen's sheet for the device's scheme FIRST, before any of the app's own CSS (see js/theme.js): it is appended
       to <head> here, so everything below wins over it at equal specificity and a plain class keeps the app look. -->
  <script src="js/theme.js"></script>
  <!-- Po web standard tokens: self-hosted Inter + Space Grotesk, the indigo accent, the light/dark palette that
       follows the device, and the shell (header, gear, build stamp, /diag cards). -->
  <link rel="stylesheet" href="css/po-tokens.css" />
  <!-- Tab with nothing focused opens the developer window (/po-dev.html). A file, not inline: the CSP is script-src 'self'. -->
  <script src="js/po-devwindow.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/gfx.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/mic.js"></script>
  <script src="js/asr.js"></script>
  <script src="js/live-audio.js"></script>
  <script src="js/save.js"></script>
  <script src="js/wake.js"></script>
  <script src="js/viewport.js"></script>
  <!-- Fonts are self-hosted (css/po-tokens.css → fonts/*.woff2): no third-party font request. Radzen's theme
       stylesheet is the one js/theme.js put above (it also swaps it when the device flips; there is no <RadzenTheme>,
       which would inject a second copy after these), and app-tokens.css bridges its variables onto the --po-* tokens. -->
  <link rel="stylesheet" href="css/app-tokens.css" />
  <link rel="stylesheet" href="css/po-motion.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="PoFightJudge.Client.styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Fight" />
</head>
<body>
  <div id="app">
    <div class="po-boot">Loading PoFightJudge…</div>
  </div>
  <div id="blazor-error-ui" role="alert">
    An unhandled error has occurred. <a href="." class="reload">Reload</a>
  </div>
  <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
  <!-- MSAL bridge for Production Entra ID sign-in (defines window.AuthenticationService); inert in Dev/Test. -->
  <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
  <script src="_framework/blazor.webassembly.js"></script>
  <!-- Install-only worker: it caches nothing (see sw.js). Registered from a file, not inline: the CSP is script-src 'self'. -->
  <script src="js/pwa.js"></script>
</body>
</html>
